<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玉米叶片 · 四因素姿态分类</title>
<script src="__PLOTLY_SRC__"></script>
<style>
/* 页面布局与窄屏适配；图层显隐由脚本控制。 */
*{box-sizing:border-box}body{margin:0;background:#f2f5f3;color:#183e32;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#123f33;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}header small{color:#c1dfd2}a{color:inherit}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid #dce5df;background:#fff}
select,button{font:inherit;border:1px solid #c8d8ce;border-radius:7px;background:#fff;color:#183e32;padding:6px 9px;cursor:pointer}
button:hover{background:#e8f2eb}label{display:inline-flex;align-items:center;gap:5px}.spacer{flex:1}
.main{display:flex;flex:1;min-height:0}#plot{flex:1;min-width:0;background:#fff}
aside{width:390px;flex-shrink:0;padding:15px;overflow:auto;border-left:1px solid #dce5df;background:#fafcfb}
.status{font-size:12px;color:#61776b;margin:0 0 10px;min-height:18px}.status.error{color:#a23228}
.card{background:#fff;padding:12px;border:1px solid #dce5df;border-radius:10px;margin-bottom:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.counts{display:flex;gap:8px;justify-content:space-between;font-weight:600}.note{font-size:12px;color:#61776b;margin:8px 0 0}
#leafList{display:flex;flex-direction:column;gap:7px}.leaf-btn{width:100%;border-left:5px solid #9ca3af;text-align:left;padding:9px;background:#fff}
.leaf-btn.selected{background:#e4f1e8;outline:2px solid #24694b}.leaf-head{display:flex;align-items:center;gap:5px}
.pill{font-size:11px;color:#fff;border-radius:12px;padding:1px 7px}.tag{font-size:10px;padding:1px 4px;background:#fff0ce;color:#8a5700;border-radius:3px}
.features{font-size:12px;color:#456052;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:6px;font-variant-numeric:tabular-nums}
.height-track{height:3px;background:#e4ebe6;margin-top:7px}.height-track i{display:block;height:100%;background:#8aa996}
h2{font-size:14px;margin:0 0 8px}#featurePlot{height:250px;margin:-4px -6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:12px}.kv b{font-variant-numeric:tabular-nums}
.empty{padding:18px;text-align:center;color:#738278}.toggle-row{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
@media(max-width:900px){aside{width:330px}.toolbar{font-size:12px}.main{min-height:500px}}
@media(max-width:650px){body{height:auto;min-height:100vh}.main{display:block}#plot{height:62vh;min-height:380px}aside{width:100%;border-left:0}header{padding:10px}h1{font-size:16px}.toolbar{padding:8px}#featurePlot{height:230px}}
</style>
</head>
<body>
<!-- 工具栏、三维场景与四因素详情共用同一选叶状态。 -->
<header>
<div><h1>玉米叶片 · 四因素姿态分类</h1><small>茎叶角 θ · 相对投影面积 P · 俯仰熵 H · 相对着生高度 h</small></div>
<span class="spacer"></span><a id="overviewLink" hidden href="index.html">返回14株总览</a>
</header>
<div class="toolbar">
<button id="prevPlant" aria-label="上一株">‹</button>
<label>植株 <select id="plantSel" aria-label="植株"></select></label>
<button id="nextPlant" aria-label="下一株">›</button>
<label>叶片 <select id="leafSel" aria-label="叶片"></select></label>
<button id="wholeBtn">清除选叶</button><label><input id="isolateLeaf" type="checkbox">仅看选中叶</label>
<label>着色 <select id="colorBySel"><option value="kmeans">姿态类别</option><option value="region">观测 / 插值 / 外推</option></select></label>
<label>类别 <select id="classFilter"><option value="all">全部类别</option><option value="convergent">紧缩</option><option value="expanded">舒展</option><option value="drooping">下垂</option></select></label>
<button id="resetFilters">清除筛选</button>
</div>
<div class="toolbar">
<div class="toggle-row">
<label><input id="chkPoints" type="checkbox">点云</label>
<label><input id="chkSurface" type="checkbox" checked>曲面</label>
<label><input id="chkInferred" type="checkbox">显示插值/外推面</label>
<label><input id="chkMidrib" type="checkbox" checked>中脉</label>
<label><input id="chkStem" type="checkbox" checked>茎秆</label>
<label><input id="chkLabels" type="checkbox" checked>标签</label>
</div>
<span class="spacer"></span><button id="frontView">侧视</button><button id="topView">俯视</button><button id="resetCamera">重置视角</button><button id="saveImage">保存图片</button>
</div>
<div class="main">
<div id="plot" aria-label="植株三维视图"></div>
<aside>
<p id="status" class="status" role="status">正在加载…</p>
<div class="card"><div class="legend"><span><i class="dot" style="background:#1f77b4"></i>紧缩</span><span><i class="dot" style="background:#1b9e77"></i>舒展</span><span><i class="dot" style="background:#d95f02"></i>下垂</span></div><div id="summary"></div><p class="note" id="modelNote"></p></div>
<div class="card"><h2>四因素详情</h2><div id="selectionInfo" class="note">点击曲面、叶片卡片或下方散点选叶。</div></div>
<div class="card"><h2>茎叶角与着生高度</h2><div id="featurePlot"></div><p class="note">颜色对应类别；点选可联动三维视图。高度已参与聚类，此图用于查看分布。</p></div>
<h2>叶片 · 按着生高度从上到下</h2><div id="leafList"></div>
</aside>
</div>
<script>
// 在线模式从接口加载，离线模式使用导出时嵌入的同结构载荷。
const BOOTSTRAP = __BOOTSTRAP_JSON__;
const CLS = {convergent:{zh:'紧缩',color:'#1f77b4'},expanded:{zh:'舒展',color:'#1b9e77'},drooping:{zh:'下垂',color:'#d95f02'}};
const cameraDefault = {eye:{x:1.45,y:1.55,z:0.9},up:{x:0,y:0,z:1}};
// 简化 DOM 访问、数值显示、类别配色和 HTML 转义。
const el = id => document.getElementById(id);
const fmt = (v,d=2) => v == null || !Number.isFinite(Number(v)) ? '—' : Number(v).toFixed(d);
const ci = key => CLS[key] || {zh:'未分类',color:'#8c8c8c'};
const esc = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let catalog={}, names=[], meta={}, payload=null, cache=new Map(), requestId=0;
// 绘制缓存和重入锁：Plotly 更新期间的回调不能再次触发选叶。
let drawnKey=null, drawnTraces=[], featureKey=null, featureGroups=[], renderPromise=null, renderRevision=0, updatingPlot=false, updatingFeature=false;
let state={plant:null,leaf:null,colorBy:'kmeans'}, plotBound=false, featureBound=false;
// 取得当前整株的叶片记录，尚未加载时返回空列表。
function allLeaves(){return payload?.info.leaves || [];}
// 读取单叶分类字段，允许未分类场景继续显示。
function record(l){return l.classification || {};}
// 按姿态类别筛选叶片。
function passes(l){
 const cf=el('classFilter').value;
 return cf==='all'||record(l).cluster_kmeans===cf;
}
// 按当前植株目录填充选择框，并同步已选叶和着色方式。
function populate(){
 el('plantSel').innerHTML=names.map(p=>'<option value="'+esc(p)+'">'+esc(p)+' · '+catalog[p].length+'叶</option>').join('');
 el('plantSel').value=state.plant;
 el('leafSel').innerHTML='<option value="">整株</option>'+catalog[state.plant].map(id=>'<option value="'+id+'">L'+id+'</option>').join('');
 el('leafSel').value=state.leaf==null?'':String(state.leaf);
 el('colorBySel').value=state.colorBy;
}
// 只更新选叶状态；重复点击同一叶不触发额外绘制。
function selectLeaf(id){
 if(id===state.leaf)return renderPromise||Promise.resolve();
 state.leaf=id;el('leafSel').value=id==null?'':String(id);syncUrl();return render();
}
// 同步地址参数，使当前植株、选叶与着色可恢复。
function syncUrl(){
 const q=new URLSearchParams({plant:state.plant,color_by:state.colorBy});
 if(state.leaf!=null)q.set('leaf',state.leaf);
 history.replaceState(null,'','?'+q.toString());
}
// 按植株和着色缓存场景；请求编号阻止旧响应覆盖新选择。
async function selectPlant(plant,leaf=null){
 const id=++requestId;
 if(BOOTSTRAP?.offline && plant!==BOOTSTRAP.initial_plant){
   const q=new URLSearchParams({color_by:state.colorBy});if(leaf!=null)q.set('leaf',leaf);
   location.href='plant_'+encodeURIComponent(plant)+'.html?'+q.toString();return;
 }
 el('status').className='status';el('status').textContent='正在加载 '+plant+'…';
 try{
  const color=state.colorBy;
  const key=plant+'_'+color;
  let next=cache.get(key);
  if(!next){
   if(BOOTSTRAP?.offline)next=BOOTSTRAP.payload;
   else{
    const response=await fetch('/api/scene?'+new URLSearchParams({plant,color_by:color}));
    if(!response.ok)throw new Error((await response.json()).error||'数据读取失败');
    next=await response.json();
   }
   cache.set(key,next);
  }
  if(id!==requestId)return;
  payload=next;state.plant=plant;state.leaf=(catalog[plant]||[]).includes(leaf)?leaf:null;
  populate();syncUrl();await render();
 }catch(error){if(id===requestId){el('status').className='status error';el('status').textContent='加载失败：'+error.message;}}
}
// 将快速连续操作合并到动画帧，串行绘制直至追上最新状态。
function render(){
 ++renderRevision;
 if(renderPromise)return renderPromise;
 renderPromise=new Promise(resolve=>requestAnimationFrame(async()=>{
  let done=-1;
  try{
   while(done!==renderRevision){const revision=renderRevision;await drawPlot();done=revision;}
  }catch(error){el('status').className='status error';el('status').textContent='绘图失败：'+error.message;}
  finally{renderPromise=null;resolve();}
 }));
 return renderPromise;
}
// 仅切换植株或着色时构造轨迹；观测面和推断面分别控制显示。
function buildTraces(){
 const result=[];
 for(const raw of payload.traces){
  if(raw.group==='labels'){
   (raw.leaf_ids||allLeaves().map(l=>l.leaf_id)).forEach((lid,i)=>{
    result.push({group:'labels',leaf_id:lid,type:'scatter3d',mode:'markers+text',
     x:[raw.x[i]],y:[raw.y[i]],z:[raw.z[i]],text:[raw.text[i]],hovertext:[raw.hovertext[i]],
     marker:{...raw.marker,color:raw.marker.color[i]},textfont:{...raw.textfont,color:raw.textfont.color[i]},
     textposition:'top center',hoverinfo:'text',showlegend:false,meta:{leaf_id:lid}});
   });
  }else if(raw.type==='mesh3d'&&raw.face_regions){
   for(const inferred of [false,true]){
    const indices=raw.face_regions.map((region,i)=>(region!==0)===inferred?i:-1).filter(i=>i>=0);
    if(!indices.length)continue;
    const t={...raw,inferred,meta:{leaf_id:raw.leaf_id}};
    for(const axis of ['i','j','k'])t[axis]=indices.map(i=>raw[axis][i]);
    if(state.colorBy==='region'){delete t.color;t.facecolor=indices.map(i=>raw.region_facecolors[i]);}
    result.push(t);
   }
  }else{
   const t={...raw};
   t.inferred=raw.region!=null&&raw.region!=='observed';
   if(raw.leaf_id!=null)t.meta={leaf_id:raw.leaf_id};
   if(state.colorBy==='region'&&raw.region_facecolors){delete t.color;t.facecolor=raw.region_facecolors;}
   result.push(t);
  }
 }
 result.push({group:'selection',type:'scatter3d',mode:'markers',name:'当前叶片',
  x:[],y:[],z:[],marker:{size:8,color:'#111827',symbol:'diamond'},hoverinfo:'skip',showlegend:false,visible:false});
 return result;
}
// 保留三维网格和轨迹编号，通过可见性及标记更新完成选叶。
async function drawPlot(){
 if(!payload)return;
 const isolate=el('isolateLeaf').checked&&state.leaf!=null;
 const visible=allLeaves().filter(l=>passes(l)&&(!isolate||l.leaf_id===state.leaf));
 const ids=new Set(visible.map(l=>l.leaf_id));
 const show={points:el('chkPoints').checked,surface:el('chkSurface').checked,midrib:el('chkMidrib').checked,stem:el('chkStem').checked,labels:el('chkLabels').checked};
 const key=state.plant+'_'+state.colorBy;
 updatingPlot=true;
 try{
  if(drawnKey!==key){
   drawnTraces=buildTraces();
   const traces=drawnTraces.map((raw,i)=>{
    const t={...raw,uid:key+'_'+i};
    for(const k of ['group','region','leaf_id','leaf_ids','pose_class','region_facecolors','face_regions','inferred'])delete t[k];
    return t;
   });
   await Plotly.react('plot',traces,{
    title:{text:esc(state.plant)+' · 整株',x:.025,font:{size:15}},
    margin:{l:0,r:0,t:40,b:0},paper_bgcolor:'#fff',showlegend:false,
    scene:{aspectmode:'data',xaxis:{title:'X'},yaxis:{title:'Y'},zaxis:{title:'Z'},camera:cameraDefault},
    uirevision:state.plant
   },{responsive:true,displaylogo:false});
   drawnKey=key;
  }
  const mask=drawnTraces.map(t=>t.group==='selection'?false:
   show[t.group]!==false&&(!t.inferred||el('chkInferred').checked)&&(t.leaf_id==null||ids.has(t.leaf_id)));
  // 选叶和筛选仅改可见性，保持 WebGL 几何缓冲与轨迹身份不变。
  await Plotly.restyle('plot',{visible:mask});
  const label=drawnTraces.find(t=>t.group==='labels'&&t.leaf_id===state.leaf);
  const index=drawnTraces.length-1;
  await Plotly.restyle('plot',{x:[label?label.x:[]],y:[label?label.y:[]],z:[label?label.z:[]],
   visible:[Boolean(label&&ids.has(state.leaf))]},[index]);
  if(!plotBound){
   el('plot').on('plotly_click',event=>{
    if(updatingPlot)return;
    const point=event.points?.[0];if(!point)return;
    const id=point.data?.meta?.leaf_id??point.customdata;
    if(Number.isInteger(id))selectLeaf(id);
   });plotBound=true;
  }
 }finally{updatingPlot=false;}
 renderSidebar(visible);
 await renderFeatures();
}
// 更新整株类别计数、选叶四因素和按着生高度排列的叶片卡片。
function renderSidebar(visible){
 const leaves=allLeaves(), counts={convergent:0,expanded:0,drooping:0};
 leaves.forEach(l=>{if(record(l).cluster_kmeans in counts)counts[record(l).cluster_kmeans]++;});
 el('summary').innerHTML='<div class="counts">'+Object.entries(counts).map(([k,n])=>'<span style="color:'+ci(k).color+'">'+ci(k).zh+' '+n+'</span>').join('')+'</div>';
 const weight=meta.primary_model?.height_weight;
 el('modelNote').textContent='紧缩候选限于顶部小型叶；各株可缺少某些类别。默认显示观测支撑面；勾选“显示插值/外推面”查看完整估计域。高度权重 '+fmt(weight,2)+'。';
 el('status').textContent='植株 '+state.plant+' · 显示 '+visible.length+' / '+leaves.length+' 片叶 · 拖动旋转，滚轮缩放';
 const selected=leaves.find(l=>l.leaf_id===state.leaf), r=selected?record(selected):null;
 el('selectionInfo').innerHTML=r?'<div class="kv">'+[
  ['叶片 / 类别','L'+selected.leaf_id+' · '+ci(r.cluster_kmeans).zh],
  ['茎叶角 θ',fmt(r.stem_leaf_angle_deg,1)+'°'],['相对投影面积 P',fmt(r.rel_projected_area,3)],
  ['俯仰熵 H（12分箱）',fmt(r.pitch_entropy_b12,3)],['相对着生高度 h',fmt(r.relative_height,3)],
  ['水平投影面积',fmt(r.projected_area_element,4)],['观测面积占比',fmt(r.coverage_observed == null ? null : 100*r.coverage_observed,1)+'%'],
  ['外推面积占比',fmt(r.coverage_extrapolated == null ? null : 100*r.coverage_extrapolated,1)+'%'],['原始簇距离比 r',fmt(r.distance_ratio_r,3)],
  ['不含高度的原始聚类',ci(r.cluster_without_height).zh],['重建支撑复查',selected.support_review_required?'仍需人工核验':'未触发支撑告警'],['远离点云面积占比',fmt(selected.support_far_area_fraction==null?null:100*selected.support_far_area_fraction,1)+'%']
 ].map(([k,v])=>'<span>'+k+'</span><b>'+esc(v)+'</b>').join('')+'</div>':'点击曲面、叶片卡片或散点查看四因素；默认保留整株，勾选“仅看选中叶”可隔离检查。';
 const sorted=[...leaves].filter(passes).sort((a,b)=>(record(b).relative_height??-1)-(record(a).relative_height??-1));
 el('leafList').innerHTML=sorted.length?sorted.map(l=>{
  const r=record(l), c=ci(r.cluster_kmeans), selected=l.leaf_id===state.leaf;
  const tags=(r.ambiguous_r080?'<span class="tag">边界</span>':'')+(r.changed_by_height?'<span class="tag">对照不同</span>':'')+(l.support_review_required?'<span class="tag">支撑待查</span>':'')+(r.semantic_reassigned?'<span class="tag">语义调整</span>':'');
  return '<button class="leaf-btn'+(selected?' selected':'')+'" style="border-left-color:'+c.color+'" data-leaf="'+l.leaf_id+'"><span class="leaf-head"><b>L'+l.leaf_id+'</b><span class="pill" style="background:'+c.color+'">'+c.zh+'</span>'+tags+'</span><span class="features"><span>θ '+fmt(r.stem_leaf_angle_deg,1)+'°</span><span>相对投影面积 '+fmt(r.rel_projected_area,3)+'</span><span>俯仰熵 '+fmt(r.pitch_entropy_b12,3)+'</span><span>相对高度 '+fmt(r.relative_height,3)+'</span></span><span class="height-track"><i style="width:'+Math.max(0,Math.min(100,100*(r.relative_height||0)))+'%"></i></span></button>';
 }).join(''):'<div class="empty">没有符合筛选条件的叶片。</div>';
 el('leafList').querySelectorAll('[data-leaf]').forEach(button=>button.onclick=()=>{const id=Number(button.dataset.leaf);selectLeaf(state.leaf===id?null:id);});
}
// 筛选条件变化时重建二维散点；选叶只改变点大小以保持响应。
async function renderFeatures(){
 updatingFeature=true;
 try{
 const key=state.plant+'_'+el('classFilter').value;
 if(key!==featureKey){
  featureGroups=Object.entries(CLS).map(([name,c])=>({
   name,c,leaves:allLeaves().filter(l=>passes(l)&&record(l).cluster_kmeans===name)
  }));
  const features=featureGroups.map(({c,leaves:group})=>({
   type:'scatter',mode:'markers',name:c.zh,
   x:group.map(l=>record(l).stem_leaf_angle_deg),y:group.map(l=>record(l).relative_height),
   customdata:group.map(l=>l.leaf_id),
   text:group.map(l=>'L'+l.leaf_id+' · 相对投影面积='+fmt(record(l).rel_projected_area,3)+' · H='+fmt(record(l).pitch_entropy_b12,3)),
   hovertemplate:'%{text}<br>θ=%{x:.1f}° · h=%{y:.3f}<extra>%{fullData.name}</extra>',
   marker:{color:c.color,size:9,line:{color:'#fff',width:1}}
  }));
  await Plotly.react('featurePlot',features,{margin:{l:40,r:12,t:10,b:40},paper_bgcolor:'#fff',plot_bgcolor:'#fff',showlegend:false,
   xaxis:{title:'茎叶角 θ (°)',gridcolor:'#edf1ee'},yaxis:{title:'相对高度 h',range:[-.03,1.03],gridcolor:'#edf1ee'}
  },{responsive:true,displaylogo:false,displayModeBar:false});
  featureKey=key;
  if(!featureBound){
   el('featurePlot').on('plotly_click',ev=>{if(updatingFeature)return;const id=ev.points?.[0]?.customdata;if(Number.isInteger(id))selectLeaf(id);});
   featureBound=true;
  }
 }
 await Plotly.restyle('featurePlot',{'marker.size':featureGroups.map(g=>g.leaves.map(l=>l.leaf_id===state.leaf?14:9))});
 }finally{updatingFeature=false;}
}
// 工具栏事件统一写入状态，再进入可合并的渲染队列。
el('plantSel').onchange=()=>selectPlant(el('plantSel').value);
el('prevPlant').onclick=()=>selectPlant(names[(names.indexOf(state.plant)-1+names.length)%names.length]);
el('nextPlant').onclick=()=>selectPlant(names[(names.indexOf(state.plant)+1)%names.length]);
el('leafSel').onchange=()=>selectLeaf(el('leafSel').value===''?null:Number(el('leafSel').value));
el('wholeBtn').onclick=()=>selectLeaf(null);
el('colorBySel').onchange=()=>{state.colorBy=el('colorBySel').value;syncUrl();if(BOOTSTRAP?.offline)render();else selectPlant(state.plant,state.leaf);};
for(const id of ['classFilter','chkPoints','chkSurface','chkMidrib','chkStem','chkLabels','isolateLeaf','chkInferred'])el(id).onchange=render;
el('resetFilters').onclick=()=>{el('classFilter').value='all';state.leaf=null;el('leafSel').value='';syncUrl();render();};
el('resetCamera').onclick=()=>Plotly.relayout('plot',{'scene.camera':cameraDefault});
el('frontView').onclick=()=>Plotly.relayout('plot',{'scene.camera':{eye:{x:0,y:2.3,z:.25},up:{x:0,y:0,z:1}}});
el('topView').onclick=()=>Plotly.relayout('plot',{'scene.camera':{eye:{x:0,y:0,z:2.5},up:{x:0,y:1,z:0}}});
el('saveImage').onclick=()=>Plotly.downloadImage('plot',{format:'png',filename:'maize_'+state.plant+(state.leaf==null?'':'_leaf_'+state.leaf),width:1400,height:1100});
// 加载在线目录或离线内嵌数据，恢复地址参数后显示初始植株。
async function boot(){
 try{
  if(typeof Plotly==='undefined')throw new Error('Plotly资源加载失败');
  let data=BOOTSTRAP;
  if(!data){const res=await fetch('/api/catalog');if(!res.ok)throw new Error('无法读取植株目录');data=await res.json();}
  catalog=data.catalog;names=Object.keys(catalog);meta=data.classification_metadata||{};
  if(!names.length)throw new Error('没有可用的重建植株');
  if(data.offline)el('overviewLink').hidden=false;
  const q=new URLSearchParams(location.search);
  state.plant=catalog[q.get('plant')]?q.get('plant'):(data.initial_plant||names[0]);
  state.colorBy=q.get('color_by')||data.initial_color_by||'kmeans';
  if(!data.has_classification){state.colorBy='region';el('colorBySel').querySelector('[value=kmeans]').disabled=true;}
  const leaf=q.has('leaf')?Number(q.get('leaf')):data.initial_leaf;
  await selectPlant(state.plant,leaf);
 }catch(error){el('status').className='status error';el('status').textContent=error.message;}
}
boot();
</script>
</body>
</html>
